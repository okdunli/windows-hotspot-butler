name: CI

# Every push runs the gates a clean checkout can run:
#   npm install -> typecheck -> the Rosezm frontend build (rosezm@0.2.2 from
#   npm) -> the Python regression suite (health_check.py).
#
# Local developers can point ROSEZM_FRAMEWORK at their own checkout; CI and
# open-source users use the npm package.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Windows runner 默认 stdout 编码是 GBK；测试大量打印中文，统一 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          # the 1:1 parity gate reads the original business package straight
          # from the git objects, so the full history has to be there
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build the Rosezm frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install desktop shell dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Regression suite (health check)
        run: python python-app/health_check.py
