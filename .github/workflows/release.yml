name: Release

# A pushed tag publishes four artifacts, in the usual vendor layout:
#   WindowsHotspotButler-<ver>-windows-amd64-setup.exe
#   WindowsHotspotButler-<ver>-windows-amd64.zip
#   WindowsHotspotButler-<ver>-windows-arm64-setup.exe
#   WindowsHotspotButler-<ver>-windows-arm64.zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      # Windows runners default to GBK for stdout; the suite prints Chinese
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          # the 1:1 parity gate reads the original package from git objects
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install desktop shell dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Detect (same gates as CI)
        run: python python-app/health_check.py

      - name: Build the single-file exe
        run: python python-app/build_exe.py --onefile

      - name: Stage the portable zip
        shell: pwsh
        run: |
          $exe = "python-app/dist/WiFiHotspotManager.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $stage = "portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe "$stage/WiFiHotspotManager.exe"
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "WindowsHotspotButler-$ver-windows-${{ matrix.arch }}.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          # Inno 的架构标识符是 x64/arm64（文件名用行业惯例 amd64/arm64）
          $innoArch = if ("${{ matrix.arch }}" -eq "amd64") { "x64" } else { "${{ matrix.arch }}" }
          & $iscc "/DMyAppVersion=$ver" "/DMyAppArch=${{ matrix.arch }}" "/DMyInnoArch=$innoArch" `
            "/DMyAppSource=..\python-app\dist\WiFiHotspotManager.exe" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem dist-installer

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            WindowsHotspotButler-*-windows-${{ matrix.arch }}.zip
            dist-installer/WindowsHotspotButler-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes need every tag and the commits between them
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the four artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*-setup.exe' \) -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate release notes
        run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Publish the pre-release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          # every release so far ships as a pre-release
          prerelease: true
